{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-grid me-2"></i> إضافة مديول جديد</h4>
                <small class="d-block text-white-50 mt-1">لـ: {{ client.name }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="addModuleForm">
                    
                    <!-- ===== معلومات المديول ===== -->
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> معلومات المديول
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label fw-bold">اسم المديول <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg" required placeholder="مثال: نظام إدارة الموارد البشرية">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">الوصف</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="تفاصيل المديول..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">السعر (ج.م)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-currency-dollar"></i></span>
                                <input type="number" name="price" class="form-control form-control-lg" value="0" step="0.01">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">الحالة</label>
                            <select name="status" class="form-select form-select-lg">
                                <option value="نشط" selected>🟢 نشط</option>
                                <option value="قيد التطوير">🟡 قيد التطوير</option>
                                <option value="مكتمل">✅ مكتمل</option>
                                <option value="متوقف">⛔ متوقف</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">تاريخ البداية</label>
                            <input type="date" name="start_date" class="form-control form-control-lg">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">تاريخ النهاية</label>
                            <input type="date" name="end_date" class="form-control form-control-lg">
                        </div>
                    </div>

                    <!-- ===== معلومات العميل ===== -->
                    <div class="card border-0 mb-4" style="background: #f0f7ff;">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <small class="text-muted d-block">العميل</small>
                                    <strong><i class="bi bi-person me-1"></i> {{ client.name }}</strong>
                                </div>
                                {% if client.company_name %}
                                <div class="col-md-6">
                                    <small class="text-muted d-block">الشركة</small>
                                    <strong><i class="bi bi-building me-1"></i> {{ client.company_name }}</strong>
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </div>

                    <!-- ===== أزرار التحكم ===== -->
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1 py-2">
                            <i class="bi bi-check-circle me-2"></i> إضافة المديول
                        </button>
                        <a href="{{ url_for('modules.client_modules', client_id=client.id) }}" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> رجوع
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary {
    background: linear-gradient(135deg, #1a237e, #0d47a1);
}
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
}
.form-control-lg:focus {
    border-color: #2563EB;
    box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
}
.form-select-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
}
.form-select-lg:focus {
    border-color: #2563EB;
    box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
}
.btn-success {
    background: linear-gradient(135deg, #28a745, #20c997);
    border: none;
    border-radius: 12px;
    transition: all 0.3s ease;
}
.btn-success:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
}
.btn-outline-secondary {
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
}
.btn-outline-secondary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}
.input-group-text {
    border-radius: 12px 0 0 12px;
    border: 2px solid #e2e8f0;
    border-right: none;
}
</style>
{% endblock %}
