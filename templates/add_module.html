{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> إضافة مديول جديد - {{ client.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">اسم المديول <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" required placeholder="مثال: نظام إدارة الموارد البشرية">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الوصف</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="تفاصيل المديول..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">السعر (ج.م)</label>
                            <input type="number" name="price" class="form-control" value="0" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الحالة</label>
                            <select name="status" class="form-select">
                                <option value="نشط">نشط</option>
                                <option value="قيد التطوير">قيد التطوير</option>
                                <option value="مكتمل">مكتمل</option>
                                <option value="متوقف">متوقف</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تاريخ البداية</label>
                            <input type="date" name="start_date" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تاريخ النهاية</label>
                            <input type="date" name="end_date" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-check-circle"></i> إضافة المديول
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
