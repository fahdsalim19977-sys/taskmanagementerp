{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-person-plus"></i> إضافة مستخدم جديد</h4></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label class="form-label">اسم المستخدم <span class="text-danger">*</span></label><input type="text" name="username" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">الاسم الكامل <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">البريد الإلكتروني <span class="text-danger">*</span></label><input type="email" name="email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">كلمة المرور <span class="text-danger">*</span></label><input type="password" name="password" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">الدور <span class="text-danger">*</span></label><select name="role" class="form-select" required><option value="موظف">موظف</option><option value="مراقب">مراقب</option><option value="مدير">مدير</option></select></div>
                    <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle"></i> إضافة المستخدم</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
