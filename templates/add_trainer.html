{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i> إضافة مدرب جديد</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="addTrainerForm">
                    
                    <!-- ===== معلومات المدرب ===== -->
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> معلومات المدرب
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">الاسم <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg" required placeholder="أدخل اسم المدرب">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">رقم الهاتف</label>
                            <input type="tel" name="phone" class="form-control form-control-lg" placeholder="مثال: 0551234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">البريد الإلكتروني</label>
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="example@domain.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">التخصص</label>
                            <input type="text" name="specialty" class="form-control form-control-lg" placeholder="مثال: تدريب تقني، مهارات قيادية">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3" placeholder="أي معلومات إضافية عن المدرب..."></textarea>
                        </div>
                    </div>

                    <!-- ===== أزرار التحكم ===== -->
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1 py-2">
                            <i class="bi bi-check-circle me-2"></i> إضافة المدرب
                        </button>
                        <a href="/trainers" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> رجوع
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary {
    background: linear-gradient(135deg, #1a237e, #0d47a1);
}
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
}
.form-control-lg:focus {
    border-color: #2563EB;
    box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
}
.btn-success {
    background: linear-gradient(135deg, #28a745, #20c997);
    border: none;
    border-radius: 12px;
    transition: all 0.3s ease;
}
.btn-success:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
}
.btn-outline-secondary {
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    transition: all 0.3s ease;
}
.btn-outline-secondary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}
</style>
{% endblock %}
