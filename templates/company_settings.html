<!-- ===== استعادة البيانات ===== -->
<div class="card mt-4">
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="bi bi-arrow-counterclockwise"></i> استعادة البيانات من النسخة الاحتياطية</h5>
    </div>
    <div class="card-body">
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle"></i>
            <strong>تحذير:</strong> استعادة البيانات ستحل محل البيانات الحالية بالكامل. تأكد من عمل نسخة احتياطية قبل الاستعادة.
        </div>
        
        <form method="POST" action="/restore_backup" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-8">
                    <input type="file" name="backup_file" class="form-control" accept=".db,.sql,.zip" required>
                    <small class="text-muted">الصيغ المدعومة: .db، .sql، .zip</small>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-danger w-100" onclick="return confirm('⚠️ هل أنت متأكد من استعادة البيانات؟ سيتم استبدال جميع البيانات الحالية!')">
                        <i class="bi bi-upload"></i> استعادة البيانات
                    </button>
                </div>
            </div>
        </form>
        
        <div class="mt-3">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i>
                يمكنك استعادة البيانات من ملفات النسخ الاحتياطي التي تم تحميلها مسبقاً.
            </small>
        </div>
    </div>
</div>
