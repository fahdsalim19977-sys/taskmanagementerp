{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> تعديل العقد</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">العميل <span class="text-danger">*</span></label>
                            <select name="client_id" class="form-select" required>
                                {% for client in clients %}
                                <option value="{{ client.id }}" {% if client.id == contract.client_id %}selected{% endif %}>
                                    {{ client.name }} ({{ client.company_name or 'بدون شركة' }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">رقم العقد <span class="text-danger">*</span></label>
                            <input type="text" name="contract_number" class="form-control" value="{{ contract.contract_number }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">عنوان العقد <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" value="{{ contract.title }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">الوصف</label>
                        <textarea name="description" class="form-control" rows="3">{{ contract.description or '' }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تاريخ البداية <span class="text-danger">*</span></label>
                            <input type="date" name="start_date" class="form-control" value="{{ contract.start_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تاريخ النهاية <span class="text-danger">*</span></label>
                            <input type="date" name="end_date" class="form-control" value="{{ contract.end_date }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">قيمة العقد (ج.م)</label>
                            <input type="number" name="contract_value" class="form-control" value="{{ contract.contract_value }}" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الحالة</label>
                            <select name="status" class="form-select">
                                <option value="نشط" {% if contract.status == 'نشط' %}selected{% endif %}>نشط</option>
                                <option value="معلق" {% if contract.status == 'معلق' %}selected{% endif %}>معلق</option>
                                <option value="منتهي" {% if contract.status == 'منتهي' %}selected{% endif %}>منتهي</option>
                                <option value="ملغي" {% if contract.status == 'ملغي' %}selected{% endif %}>ملغي</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">ملاحظات</label>
                        <textarea name="notes" class="form-control" rows="2">{{ contract.notes or '' }}</textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-save"></i> حفظ التغييرات
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
